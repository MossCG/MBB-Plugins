name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag
        required: true
        default: v0.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout plugins
        uses: actions/checkout@v4

      - name: Checkout MoBoxBot
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/MoBoxBot
          path: MoBoxBot

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build MoBoxBot
        shell: powershell
        run: .\MoBoxBot\build.ps1

      - name: Build plugins
        shell: powershell
        run: .\build-all.ps1 -Bot .\MoBoxBot\out\MoBoxBot.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: MBB-*/out/MBB-*.jar
