name: build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout plugins
        uses: actions/checkout@v4

      - name: Checkout MoBoxBot
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/MoBoxBot
          path: MoBoxBot

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build MoBoxBot
        shell: powershell
        run: .\MoBoxBot\build.ps1

      - name: Build plugins
        shell: powershell
        run: .\build-all.ps1 -Bot .\MoBoxBot\out\MoBoxBot.jar

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MBB-Plugins
          path: MBB-*/out/MBB-*.jar
