name: build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout plugins
        uses: actions/checkout@v4

      - name: Checkout MoBoxBot
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/MoBoxBot
          path: MoBoxBot

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build MoBoxBot
        shell: powershell
        run: .\MoBoxBot\build.ps1

      - name: Build plugins
        shell: powershell
        run: .\build-all.ps1 -Bot .\MoBoxBot\out\MoBoxBot.jar

      - name: Package release archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          if (Test-Path -LiteralPath "MBB-Plugins.zip") {
            Remove-Item -LiteralPath "MBB-Plugins.zip" -Force
          }
          $pluginJars = Get-ChildItem -Path "out\MBB-*.jar" -File
          if (-not $pluginJars) {
            throw "没有找到插件 JAR。"
          }
          Compress-Archive -Path $pluginJars.FullName -DestinationPath "MBB-Plugins.zip" -Force

      - name: Read version
        id: version
        shell: powershell
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          "tag=$version" >> $env:GITHUB_OUTPUT

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MBB-Plugins
          path: out/MBB-*.jar

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: MBB-Plugins.zip
