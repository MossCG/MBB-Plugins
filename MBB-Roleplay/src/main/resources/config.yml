#MBB-Roleplay 插件配置

#是否启用角色扮演
enable: true
#AI 使用的模型配置名，对应 MBB-AI 的 profiles.json
aiProfile: "default"
#同一群两次回复的最小间隔秒数
replyCooldownSecond: 5
#同一群每小时最多回复次数
maxRepliesPerHour: 180
#非直接提及消息命中兴趣关键词后的回复概率，0 到 1
interestReplyChance: 0.65
#最近与角色聊过天后，延续对话的回复概率
conversationWindowSecond: 180
continuationReplyChance: 0.80
#普通疑问句的回复概率
questionReplyChance: 0.40
#普通群聊消息的随机参与概率
ambientReplyChance: 0.12
#即时上下文消息条数
shortContextMessages: 80
#短期记忆覆盖天数
shortTermDays: 3
#每累计多少条消息更新一次记忆
memoryUpdateMessages: 50
#每次记忆整理最多读取的消息条数
memoryExtractMessages: 300
#最多加载多少条长期记忆
maxLongMemories: 150
#单次角色回复最大 Token
replyMaxTokens: 1200
#角色设定文件
personaFile: "persona.json"
#忽略少于多少字的纯文本消息
minMessageLength: 2
