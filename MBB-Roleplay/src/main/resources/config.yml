#MBB-Roleplay 插件配置

#配置结构版本，插件升级时自动维护
configVersion: 42
#是否启用角色扮演
enable: true
#AI 使用的模型配置名，对应 MBB-AI 的 profiles.json
aiProfile: "default"
#记忆整理使用的模型配置名，留空则使用 aiProfile；可换成非 reasoning 模型
memoryProfile: ""
#角色理解当前时间使用的时区
timeZone: "Asia/Shanghai"
#同一群两次回复的最小间隔秒数
replyCooldownSecond: 5
#同一群每小时最多回复次数
maxRepliesPerHour: 180
#角色对所有真人成员的初始好感度，0 到 100
initialAffinity: 65
#角色对所有真人成员的初始信任度，0 到 100
initialTrust: 60
#群主和群管理员的初始好感倍率
initialGroupAdminMultiplier: 1.05
#botAdmin 的初始好感倍率
initialBotAdminMultiplier: 1.10
#botOwner 的初始好感倍率
initialBotOwnerMultiplier: 1.15
#同一用户每天好感、信任和厌烦的最大累计变化值
relationDailyMaxDelta: 2
#达到该好感度时，常态允许轻微亲密互动
intimacyCloseAffinity: 75
#达到该好感度时，允许明显的撒娇和日常亲密举动
intimacyVeryCloseAffinity: 90
#是否启用角色情绪与用户关系机制
emotionEnable: true
#情绪回落间隔，每隔多少分钟向角色人格基线靠近一次
emotionDecayMinute: 30
#同一用户同一类情绪事件的规则更新冷却秒数
emotionEventCooldownSecond: 300
#是否异步调用 AI 分析语义情绪原因
emotionAnalyzeEnable: true
#AI 情绪分析范围：off / direct / significant
emotionAnalyzeMode: "significant"
#情绪分析使用的模型配置名，留空则使用 aiProfile
emotionAnalyzeProfile: ""
#同一用户两次 AI 情绪分析的最小间隔秒数
emotionAnalyzeCooldownSecond: 300
#情绪分析输出 Token 上限
emotionAnalyzeMaxTokens: 2400
#情绪分析思考强度：low / medium / high，留空表示不发送
emotionAnalyzeReasoningEffort: "low"
#单次 AI 情绪分析对单项数值的最大变化
emotionAnalyzeMaxDelta: 0.8
#用户级情绪原因的最大字符数
emotionReasonMaxChars: 120
#低于该强度时不再把情绪原因注入提示词
emotionReasonMinStrength: 40
#情绪原因在无新证据时完全衰减的固定参考天数
emotionReasonDecayDays: 30
#情绪事件流水保留天数
emotionEventRetentionDays: 90
#心情好时非直接消息的回复概率加成
emotionPositiveReplyBonus: 0.05
#心情差或耐心低时非直接消息的回复概率扣减
emotionNegativeReplyPenalty: 0.15
#对高好感用户非直接消息的回复概率加成
emotionAffinityReplyBonus: 0.08
#对低好感或高厌烦用户非直接消息的回复概率扣减
emotionAffinityReplyPenalty: 0.15
#是否允许角色识别并创建自然语言定时提醒
reminderEnable: true
#是否优先调用 AI 识别提醒意图和时间，失败时回退到内置规则
reminderAiParse: true
#定时提醒最长可提前多少天
reminderMaxDays: 30
#非直接提及消息命中兴趣关键词后的回复概率，0 到 1
interestReplyChance: 0.65
#最近与角色聊过后，延续对话的窗口秒数
conversationWindowSecond: 180
continuationReplyChance: 0.80
#其他群员接续当前话题时的回复概率
otherParticipantReplyChance: 0.45
#本地回复意愿门控模式：off / shadow / enforce；默认 shadow 只记录不拦截
replyWillingnessMode: shadow
#回复意愿低于该值时视为低意愿
replyWillingnessThreshold: 0.35
#计算近期群活跃度和角色自身发言占比的时间窗口秒数
replyWillingnessWindowSecond: 300
#检测到另一个角色机器人发言时，继续接话的概率
otherRoleBotReplyChance: 0.50
#没有真人插话时，最多连续回应另一个角色机器人多少条
maxConsecutiveOtherRoleMessages: 2
#识别文本中提到的角色名，英文逗号分隔；昵称命中不再代表对方就是该角色
otherRoleBotNames: ""
#其他角色机器人 QQ，多个用英文逗号分隔；只有 QQ 命中才视为角色本人，为空时不识别其他机器人
otherRoleBotQQs: ""
#消息明确艾特其他成员且没有提到角色时是否跳过
addressedOtherMemberSkip: true
#同一用户刚被回复后，多少秒内的短句视为补充不再回复，0 表示关闭
splitMessageSuppressSecond: 20
#触发补充抑制的最大字数
splitMessageSuppressMaxChars: 20
#即时上下文消息条数
shortContextMessages: 200
#即时上下文最多注入多少字符，按新到旧保留，避免 200 条长消息把请求撑爆
shortContextMaxChars: 12000
#是否把当前群的话题、背景、进展、待办和约定压成结构化上下文
structuredContextEnable: true
#结构化上下文最多注入字符数
structuredContextMaxChars: 1800
#结构化上下文单条最多字符数
structuredContextItemMaxChars: 160
#短期记忆覆盖天数
shortTermDays: 3
#每累计多少条消息更新一次记忆
memoryUpdateMessages: 50
#每次记忆整理最多读取的消息条数
memoryExtractMessages: 300
#每次记忆整理最多送入模型的字符数，避免上下文过长
memoryExtractMaxChars: 16000
#单次自动整理最多连续处理的批次，避免积压消息一次消耗过多
memoryExtractBatches: 3
#记忆整理输出 Token 上限，reasoning 模型建议不低于 12000
memoryMaxTokens: 12000
#长期记忆合并输出 Token 上限，reasoning 模型建议不低于 32000
memoryMergeMaxTokens: 32000
#记忆合并单批条数
memoryMergeBatchSize: 100
#记忆合并最多执行多少轮分批压缩
memoryMergeMaxRounds: 3
#记忆合并单批失败后的最大重试次数，0 表示不重试
memoryMergeRetryCount: 3
#记忆合并最多同时处理多少批，范围 1 到 4
memoryMergeConcurrency: 4
#单个群两次自动长期记忆合并之间的冷却分钟数，0 表示不限制
memoryMergeCooldownMinute: 60
#两次自动永久记忆合并之间的冷却分钟数，0 表示不限制
globalMemoryMergeCooldownMinute: 60
#是否启用所有群共享的永久记忆
globalMemoryEnable: true
#允许从哪些群的上下文学习永久记忆，多个群号用英文逗号分隔；为空时暂不学习
globalMemoryLearnGroups: ""
#最多加载多少条全局永久记忆
globalMemoryMaxItems: 300
#每次注入角色提示词的全局永久记忆条数
globalMemoryInjectItems: 80
#是否启用角色台词语料检索
speechCorpusEnable: true
#台词语料目录；speech-corpus-<角色>-qq.jsonl 优先，speech-corpus-<角色>.jsonl 仅作保底
speechCorpusDirectory: "speech-corpus"
#每次注入多少条参考台词
speechRetrievalCount: 2
#参考台词注入的最大字符数
speechRetrievalMaxChars: 1200
#台词检索最低分数
speechRetrievalMinScore: 0.35
#回复与台词语料相似度达到多少时视为照抄
speechSimilarityThreshold: 0.78
#少于多少字的回复不做照抄检测
speechSimilarityMinChars: 6
#是否启用可选知识库
knowledgeEnable: true
#知识库目录，相对插件数据目录
knowledgeDirectory: "knowledge"
#单次最多注入几个知识库条目
knowledgeMaxEntries: 4
#每个条目最多注入几个小节
knowledgeMaxSectionsPerEntry: 2
#知识库检索最低分，低于该分数不注入
knowledgeMinScore: 1.0
#单次知识库注入的总字符上限
knowledgeInjectMaxChars: 2000
#允许注入的最高剧透等级：0 只注入无剧透，1 允许轻度，2 全部
knowledgeSpoilerLevel: 0
#是否允许角色通过回复末尾的 <remember> 主动触发记忆整理
activeMemory: true
#是否允许角色理解群聊图片和表情包
imageUnderstandingEnable: true
#图片理解模式：off 关闭 / addressed 只处理直接提及或连续对话 / all 处理全部图片
imageUnderstandingMode: "addressed"
#每个群每小时最多识图次数，0 表示不限制
imageUnderstandingMaxPerHour: 30
#识图结果是否把 OCR 文字注入角色上下文
imageUnderstandingInjectOcr: true
#图片理解使用的模型配置名，留空则使用 MBB-Vision 默认配置
imageUnderstandingProfile: ""
#图片理解结果注入角色的最大字符数
imageUnderstandingMaxChars: 600
#用户发送图片后，后续提问可复用原图作为上下文的时间窗口秒数
imageContextTimeoutSecond: 300
#纯图片与表情消息的识图放到独立异步任务，不阻塞回复线程
imageAsyncEnable: true
#是否与 MBB-BotHub 协作；关闭后完全退回单机行为
hubEnable: true
#是否共享识图结果，避免同群多个 bot 重复识图
hubVisionShareEnable: true
#等待其他 bot 识图结果的毫秒数，超时回退本地识图
hubVisionWaitMs: 15000
#是否共享回合权，避免同群多个 bot 抢答同一条消息
hubTurnShareEnable: true
#是否跨进程去重任务创建（提醒等），避免两个 bot 建同一个任务
hubTaskDedupEnable: true
#是否用 hub 做机器人互聊熔断，避免两个 bot 旁若无人的刷屏
hubChatGuardEnable: true
#是否通过 hub 广播打字状态，让其他角色知道自己在生成
hubTypingBroadcastEnable: true
#是否等待用户补发表情包后再生成一次回复
stickerAttachEnable: true
#文字回合等待同用户补发表情包的最长秒数，用户又发言或表情包先到都会提前结束等待
stickerAttachWindowSecond: 7
#表情包已开始识别时，最多额外等待多少秒
stickerAttachMaxWaitSecond: 15
#同一用户又发言或表情包已附带时立刻结束等待，不再干等到窗口结束
stickerAttachWaitUntilNextMessage: true
#提示词中的表情包参考使用率，0 到 1；不是代码强制抽样
stickerSendChance: 0.35
#是否用视觉模型从候选拼图中选择表情包
stickerVisionEnable: true
#视觉选择时最多生成多少张候选拼图，2 到 9
stickerVisionCandidates: 6
#表情包视觉选择使用的 AI profile，留空时使用 aiProfile
stickerVisionProfile: ""
#表情包视觉选择输出 Token 上限
stickerVisionMaxTokens: 600
#表情包视觉选择请求超时秒数
stickerVisionTimeoutSecond: 45
#是否启用群消息合批：短时间内连续到达的消息会合并成一个回合处理，避免刷屏时逐条排队
messageBatchEnable: true
#合批窗口秒数，窗口内到达的新消息会并入同一批
messageBatchWindowSecond: 2
#自适应防抖档位：off / fast / natural / steady
messageBatchDebounceMode: natural
#单批从第一条消息开始的绝对等待上限秒数，防止连续发言无限延长
messageBatchMaxWaitSecond: 8
#单个批次最多合并多少条消息，超出时丢弃最旧的非直接点名消息
messageBatchMaxMessages: 10
#合批消息最多等待多少秒，超过且没有点名时直接丢弃，0 表示不丢弃
messageBatchMaxAgeSecond: 20
#合批回合最多回复几段，每段可以回应批内不同的消息
batchMaxSegments: 4
#是否允许用 /role learn 采集训练语料
learnEnable: true
#采集语料的存放目录，相对插件数据目录
learnDirectory: "train-corpus"
#采集时向前截取多少条上下文
learnContextBefore: 6
#采集时向后截取多少条上下文
learnContextAfter: 3
#MBB-Model 风格层小模型服务地址
modelServiceUrl: "http://127.0.0.1:8770"
#访问 MBB-Model 的 token，留空表示不校验
modelServiceToken: ""
#调用 MBB-Model 的超时秒数
modelServiceTimeoutSecond: 120
#是否允许用 /role train 提交训练
trainEnable: true
#群聊语料训练时，每条样本带多少条前文
trainContextBefore: 4
#单次训练最多导出多少条样本
trainMaxSamplesPerRun: 2000
#超过这个长度的群消息不参与训练
trainMaxChars: 200
#是否把机器人自己的消息也算进训练语料
trainIncludeBotMessages: false
#提交数据后是否自动开始训练
trainAutoStart: true
#是否响应戳一戳；MBB-Poke 启用时本插件自动跳过
pokeReplyEnable: true
#被戳时是否允许角色戳回去
pokeBackEnable: true
#戳一戳回复单条短消息的最大字符数
pokeReplyMaxChars: 20
#对同一用户戳回去的最小间隔秒数
pokeBackCooldownSecond: 60
#连续戳一戳的统计窗口秒数，窗口内超过阈值才算骚扰
pokeStreakWindowSecond: 60
#窗口内戳几次开始算骚扰，达到后才会涨厌烦
pokeStreakThreshold: 3
#最多加载多少条长期记忆
maxLongMemories: 150
#是否启用群级话题疲劳检测
topicFatigueEnable: true
#同一话题进入疲劳判定的时间窗口分钟数
topicFatigueWindowMinute: 30
#同一话题在窗口内达到多少次后判定为疲劳
topicFatigueMinCount: 6
#角色自己在窗口内参与多少次后判定为疲劳
topicFatigueSelfCount: 3
#话题疲劳记录最多保留多少小时
topicFatigueKeepHours: 168
#是否维护会话线程和当前回合状态
threadEnable: true
#超过多少秒没有新消息就视为新线程
threadWindowSecond: 180
#是否根据主动发言是否被接话修正回复意愿
replyFeedbackEnable: true
#主动发言后多少秒内出现真人发言算被接话
replyFeedbackWindowSecond: 180
#至少积累多少次主动发言反馈后才修正概率
replyFeedbackMinSamples: 6
#主动发言长期没人接时最多降低多少回复概率
replyFeedbackMaxPenalty: 0.25
#主动发言经常被接话时最多提高多少回复概率
replyFeedbackBonus: 0.10
#内存中保留最近多少次主动发言反馈
replyFeedbackHistory: 30
#独立风格层已移除；保留键位仅用于兼容旧配置，实际不再使用
styleEnable: false
#整段回复超过多少字符时给复核层附加“超长”提示；单句超长始终单独检测
styleMaxChars: 60
#是否启用整段总长度超限提示；单句超长不受这个开关影响
styleLongReplyEnable: false
#旧独立风格层模型配置，已不再使用
styleProfile: ""
#旧独立风格层 Token 配置，已不再使用
styleMaxTokens: 1200
#旧独立风格层思考强度，已不再使用
styleReasoningEffort: "low"
#主动发言时是否给复核层附加风格处理提示
styleProactiveEnable: false
#旧独立风格层熔断配置，已不再使用
styleFailureThreshold: 2
#旧独立风格层熔断配置，已不再使用
styleFailureCooldownSecond: 600
#是否在发送前复核角色回复，并统一处理风格、链接和长句分句
replyReviewEnable: true
#复核使用的模型配置名，留空使用 aiProfile
replyReviewProfile: ""
#复核输出 Token 上限
replyReviewMaxTokens: 1200
#复核思考强度：none / low / medium / high
replyReviewReasoningEffort: "none"
#复核请求超时秒数
replyReviewTimeoutSecond: 60
#复核最低通过分；合法 rewrite 无论评分是否通过都会采用
replyReviewMinScore: 70
#是否允许角色通过原生工具调用查询信息或维护私有工作区
toolEnable: true
#首轮直接开放的轻量工具，其他工具通过 tool_search 按需加载
toolCoreTools: "tool_search,end_turn,message_send,sticker"
#单轮最多同时加载多少个工具 schema
toolLoadedMaxTools: 8
#tool_search 单次最多返回多少个工具
toolSearchMaxResults: 4
#单轮最多进行多少次模型-工具循环
toolMaxSteps: 16
#单轮最多执行多少个工具调用
toolMaxCalls: 12
#单个工具结果注入上下文的最大字符数
toolResultMaxChars: 16000
#单轮所有工具结果合计最多注入多少字符
toolResultTotalMaxChars: 48000
#工具执行期间最多并入多少条新群消息
toolLiveMessageMax: 10
#单轮工具循环总时间上限毫秒
toolLoopMaxMillis: 75000
#单个工具调用时间上限毫秒
toolCallMaxMillis: 20000
#只读工具是否允许同一模型响应内并行执行
toolParallelReadOnlyEnable: true
#工具执行线程数上限
toolParallelMax: 4
#工具循环中的 AI 请求重试次数，默认不重试以控制整轮时间
toolAiRetryCount: 0
#是否持久化工具回合，进程重启后可恢复未完成回合
toolTurnPersistEnable: true
#工具回合记录保留小时数
toolTurnKeepHours: 24
#进程重启后，开始时间在多长分钟内且未完成的工具回合可以恢复
toolRecoverMaxMinutes: 60
#下一轮注入最近多少次工具调用结果
toolMemoryInjectItems: 8
#工具调用结果注入字符上限
toolMemoryInjectMaxChars: 6000
#工具调用记录保留小时数
toolMemoryKeepHours: 72
#工具调用记录最大行数
toolMemoryMaxRows: 500
#是否启用角色私有工作区 plugins/MBB-Roleplay/data
workspaceEnable: true
#工作区单次读取最大字符数
workspaceMaxReadChars: 32000
#工作区单次写入最大字符数
workspaceMaxWriteChars: 64000
#工作区列表最多返回多少个文件
workspaceMaxFilesPerList: 200
#工作区总大小上限，默认 64MB
workspaceMaxTotalBytes: 67108864
#工作区单张导入图片最大字节数，默认 8MB
workspaceMaxMediaBytes: 8388608
#覆盖写入前是否在 .history 留下旧版本
workspaceHistoryEnable: true
#每个文件最多保留多少个历史版本
workspaceHistoryMaxVersions: 10
#工作区回收站保留天数
workspaceTrashKeepDays: 30
#是否开放受限网页浏览工具
webEnable: true
#网页允许域名，多个用英文逗号分隔；默认优先二次元百科、游戏资料站和公开技术资料
webWhitelist: "wikipedia.org,baike.baidu.com,bilibili.com,biligame.com,wiki.biligame.com,gamekee.com,bluearchive.wiki,kivo.wiki,moegirl.org.cn,bangumi.tv,bgm.tv,huijiwiki.com,prts.wiki,wiki.gg,game8.jp,appmedia.jp,kamigame.jp,ani.gamer.com.tw,fandom.com,namu.wiki,arca.live,github.com,raw.githubusercontent.com,deepwiki.com,duckduckgo.com,bing.com"
#联网搜索地址模板，{query} 会替换成 URL 编码后的查询词
webSearchUrl: "https://www.bing.com/search?q={query}"
#可选联网搜索备用地址模板；默认留空，只使用 Bing，不合并多个搜索源
webSearchFallbackUrl: ""
#单次联网搜索最多返回多少条摘要
webSearchMaxResults: 10
#owner 最近多少秒内提出过内网访问请求时，允许工具访问内网地址
webOwnerAuthWindowSecond: 300
#网页连接超时秒数
webTimeoutSecond: 15
#网页最多读取字节数
webMaxBytes: 262144
#网页净化后最多注入字符数
webMaxChars: 12000
#网页图片发送单张最多读取的字节数
webImageMaxBytes: 8388608
#网页和搜索结果缓存秒数，0 表示不缓存
webCacheSecond: 300
#是否启用本地提示词硬字符预算
contextHardLimitEnable: false
#启用本地硬预算时，单轮提示词总字符上限
promptTotalChars: 120000
#是否在发送前加入拟人打字延迟
pacingEnable: true
#基础延迟毫秒
pacingBaseMs: 350
#每个字符增加的延迟毫秒
pacingPerCharMs: 25
#单次延迟上限毫秒
pacingMaxMs: 2500
#深夜时段延迟倍率
pacingNightMultiplier: 1.40
#群活跃时的延迟倍率
pacingActiveMultiplier: 0.80
#注意力高于该值时视为群活跃
pacingActiveThreshold: 0.70
#深夜时段开始小时
pacingNightStartHour: 0
#深夜时段结束小时
pacingNightEndHour: 6
#是否启用角色安全与防注入
safetyGuardEnable: true
#是否拦截系统提示词诱导和越狱指令
promptInjectionGuardEnable: true
#是否拦截现实隐私索取
privacyGuardEnable: true
#是否从群聊提取表达候选供管理员复核
expressionLearnEnable: true
#表达候选至少出现多少次才进入待审
expressionMinCount: 3
#表达候选至少被多少不同群员使用才进入待审
expressionMinUsers: 2
#每个群最多注入多少条已通过表达
expressionMaxCandidates: 200
#已通过表达注入提示词的最大字符数
expressionInjectMaxChars: 800
#是否使用 embedding 做表达候选向量检索
expressionVectorEnable: true
#表达 embedding 使用的 AI profile，留空时使用 aiProfile
expressionEmbeddingProfile: ""
#表达 embedding 请求超时秒数
expressionEmbeddingTimeoutSecond: 60
#向量检索每次最多返回多少条表达候选
expressionVectorTopK: 6
#向量检索最低混合相似度
expressionVectorMinScore: 0.25
#查询 embedding 的本地缓存分钟数
expressionVectorQueryCacheMinute: 10
#是否定期用 AI 审核表达候选
expressionReviewEnable: true
#表达审核模式：suggest 只保存理解，auto 同时自动通过或拒绝
expressionReviewMode: suggest
#表达审核使用的 AI profile，留空时使用 aiProfile
expressionReviewProfile: ""
#表达审核定时任务间隔小时
expressionReviewIntervalHours: 24
#单群单次最多审核多少条表达候选
expressionReviewMaxCandidates: 50
#表达审核输出 Token 上限
expressionReviewMaxTokens: 3000
#表达审核请求超时秒数
expressionReviewTimeoutSecond: 120
#auto 模式自动通过的最低质量
expressionAutoApproveMinQuality: 0.70
#是否启用注意力漂移
attentionDriftEnable: true
#注意力向基线衰减的半衰期分钟数
attentionDecayMinute: 30
#低于该注意力时降低主动接话概率
attentionLowThreshold: 0.25
#高于该注意力时提高主动接话概率
attentionHighThreshold: 0.70
#低注意力时最多降低多少回复概率
attentionMaxPenalty: 0.20
#高注意力时最多提高多少回复概率
attentionBonus: 0.05
#每个群最多追踪多少话题的注意力
attentionTopicLimit: 200
#是否启用每日复盘
dailyReviewEnable: true
#每日复盘在本地时间的几点执行
dailyReviewHour: 4
#每日复盘最多读取多少条消息
dailyReviewMaxMessages: 300
#每日复盘输出 Token 上限
dailyReviewMaxTokens: 4000
#每日复盘请求超时秒数
dailyReviewTimeoutSecond: 180
#是否记录每轮路由、资料和回复 trace，便于排查角色为什么这样回
traceEnable: true
#trace 保留小时数
traceKeepHours: 72
#trace 最大保留行数
traceMaxRows: 2000
#是否允许 /role eval 运行内置评测集
evalEnable: true
#评测使用的模型配置名，留空使用 aiProfile
evalProfile: ""
#评测输出 Token 上限
evalMaxTokens: 1200
#评测请求超时秒数
evalTimeoutSecond: 60
#长期记忆与永久记忆是否按当前对话相关性排序后注入
memoryRelevanceSort: true
#相关性排序前先加载多少条长期记忆作为候选池
memoryRelevancePoolSize: 600
#长期记忆按相关性注入的字符上限
memoryRelevanceMaxChars: 12000
#是否在写入长期记忆时检测并归档冲突旧记忆
memoryConflictResolveEnable: true
#冲突判定所需的最小 bigram 重合数
memoryConflictMinOverlap: 2
#永久记忆按相关性注入的字符上限
globalMemoryRelevanceMaxChars: 10000
#单次角色回复最大 Token
replyMaxTokens: 4000
#带图片上下文时单次角色回复最大 Token
replyImageMaxTokens: 4000
#单段回复硬上限字符数，不设最低字数
replySegmentMaxChars: 30
#回复拆分时优先使用的断句符号；先找句末标点，再找逗号、顿号、冒号、分号、波浪号等弱标点
replySplitPunctuation: "。！？!?；;，、：,:～~…"
#最多拆分发送多少段
replyMaxSegments: 5
#普通聊天最多拆成多少个连续节拍
replyBeatMaxSegments: 5
#连续节拍基础间隔毫秒
replyBeatBaseDelayMs: 450
#节拍中每个字符增加的间隔毫秒
replyBeatPerCharMs: 35
#连续节拍单次最大间隔毫秒
replyBeatMaxDelayMs: 2200
#是否过滤模型回复中凭空输出的网址链接
replyLinkFilterEnable: true
#是否允许 draw 技能模拟角色手机自拍和拍照
cameraEnable: true
#生图是否启用独立 prompt 编译层：角色层只给画面 brief，编译器再注入角色 canonical tag 和负向词
drawPromptCompilerEnable: true
#生图 prompt 编译使用的模型配置名，留空使用 aiProfile
drawPromptProfile: ""
#生图 prompt 编译输出 Token 上限
drawPromptMaxTokens: 1800
#生图 prompt 编译思考强度：none / low / medium / high
drawPromptReasoningEffort: "none"
#生图 prompt 编译请求超时秒数
drawPromptTimeoutSecond: 120
#最终正向 prompt 最大字符数
drawPromptMaxChars: 1600
#最终角色专属负向 prompt 最大字符数
drawPromptNegativeMaxChars: 800
#当前角色知识库外貌参考注入的最大字符数，只取当前角色自己的学生条目
drawPromptKnowledgeMaxChars: 1200
#重复检测时参考最近多少条角色回复
recentReplyCheckCount: 8
#是否启用代码层重复回复兜底检测；关闭后只在提示词中约束
repeatSuppressEnable: false
#与最近角色回复相似度达到多少时跳过，0.3 到 1
repeatSimilarityThreshold: 0.72
#少于多少字的回复不进行重复检测
repeatCheckMinChars: 6
#同一开头在最近角色回复中出现多少次后禁止再次使用
repeatOpeningLimit: 2
#忽略以这些前缀开头的指令消息，英文逗号分隔
commandPrefixes: "/,!,＃,#"
#角色设定文件：persona-aris.json（爱丽丝/Aris）/ persona-momoi.json（桃井）/ persona-midori.json（绿）
personaFile: "persona-aris.json"
#忽略少于多少字的纯文本消息
minMessageLength: 2
#是否启用免打扰名单：名单内的群员只在主动叫到角色时才得到回复，其他群员不受影响
quietReplyEnable: true
#是否允许私聊；默认只响应 owner 和机器人 QQ 好友
privateChatEnable: true
#旧版私聊白名单，仅保留配置兼容；好友制启用后不再放行非好友
privateChatWhitelist: ""
#QQ 好友列表缓存秒数，查询失败时非 owner 私聊会被拒绝
privateChatFriendCacheSecond: 300
#私聊上下文保留条数
privateChatContextMessages: 40
#私聊单条回复最大字符数
privateChatMaxReplyChars: 160
#私聊收到图片或表情包后等待补充文字再回复的秒数
privateChatImageDebounceSecond: 4
#生成期间又收到私聊时，最多丢弃旧候选并合并重生成几次
privateChatLiveMergeMaxRounds: 2
#单个用户等待处理的私聊消息上限
privateChatPendingMaxMessages: 10
#是否用 QQ input_status 作为私聊等待参考
privateChatInputStatusEnable: true
#最后一次 input_status 后继续等待的秒数
privateChatInputStatusGraceSecond: 3
#input_status 最多让一条待回复私聊延后多少秒，防止无限等待
privateChatInputStatusMaxWaitSecond: 10
#是否由角色决定好友申请是否通过
friendRequestRoleDecisionEnable: true
#好友申请裁决使用的 AI profile，留空时使用 aiProfile
friendRequestRoleDecisionProfile: ""
#角色同意好友申请所需的最低置信度
friendRequestRoleDecisionMinConfidence: 0.55
#好友申请裁决输出 Token 上限
friendRequestRoleDecisionMaxTokens: 1600
#好友申请裁决请求超时秒数
friendRequestRoleDecisionTimeoutSecond: 60
#是否启用随机刻主动互动
randomTickEnable: true
#随机刻最短间隔分钟数
randomTickMinMinute: 10
#随机刻最长间隔分钟数
randomTickMaxMinute: 30
#随机刻静默开始小时
randomTickQuietStartHour: 0
#随机刻静默结束小时
randomTickQuietEndHour: 8
#群主动话题统计窗口分钟数
randomTickGroupWindowMinute: 360
#窗口内最多执行多少次群主动话题，0 表示关闭
randomTickGroupMaxActions: 2
#每天最多发布多少条 Qzone 说说，0 表示关闭
randomTickQzoneDailyMax: 2
#owner 最近互动窗口分钟数，用于提高主动私聊概率
randomTickOwnerRecentWindowMinute: 180
#最近互动 owner 直接触发主动私聊的基础概率，0 到 1
randomTickOwnerRecentBoostChance: 0.30
#相同主动行为指纹的去重小时数
randomTickDedupeHours: 24
#随机刻决策输出 Token 上限
randomTickMaxTokens: 1200
#随机刻请求超时秒数
randomTickTimeoutSecond: 90
#随机刻思考强度：none / low / medium / high
randomTickReasoningEffort: "low"
