#MBB-Roleplay 插件配置

#配置结构版本，插件升级时自动维护
configVersion: 21
#是否启用角色扮演
enable: true
#AI 使用的模型配置名，对应 MBB-AI 的 profiles.json
aiProfile: "default"
#记忆整理使用的模型配置名，留空则使用 aiProfile；可换成非 reasoning 模型
memoryProfile: ""
#角色理解当前时间使用的时区
timeZone: "Asia/Shanghai"
#同一群两次回复的最小间隔秒数
replyCooldownSecond: 5
#同一群每小时最多回复次数
maxRepliesPerHour: 180
#角色对所有真人成员的初始好感度，0 到 100
initialAffinity: 65
#角色对所有真人成员的初始信任度，0 到 100
initialTrust: 60
#群主和群管理员的初始好感倍率
initialGroupAdminMultiplier: 1.05
#botAdmin 的初始好感倍率
initialBotAdminMultiplier: 1.10
#botOwner 的初始好感倍率
initialBotOwnerMultiplier: 1.15
#同一用户每天好感、信任和厌烦的最大累计变化值
relationDailyMaxDelta: 2
#达到该好感度时，常态允许轻微亲密互动
intimacyCloseAffinity: 75
#达到该好感度时，允许明显的撒娇和日常亲密举动
intimacyVeryCloseAffinity: 90
#是否启用角色情绪与用户关系机制
emotionEnable: true
#情绪回落间隔，每隔多少分钟向角色人格基线靠近一次
emotionDecayMinute: 30
#同一用户同一类情绪事件的规则更新冷却秒数
emotionEventCooldownSecond: 300
#是否异步调用 AI 分析语义情绪原因
emotionAnalyzeEnable: true
#AI 情绪分析范围：off / direct / significant
emotionAnalyzeMode: "significant"
#情绪分析使用的模型配置名，留空则使用 aiProfile
emotionAnalyzeProfile: ""
#同一用户两次 AI 情绪分析的最小间隔秒数
emotionAnalyzeCooldownSecond: 300
#情绪分析输出 Token 上限
emotionAnalyzeMaxTokens: 2400
#情绪分析思考强度：low / medium / high，留空表示不发送
emotionAnalyzeReasoningEffort: "low"
#单次 AI 情绪分析对单项数值的最大变化
emotionAnalyzeMaxDelta: 0.8
#用户级情绪原因的最大字符数
emotionReasonMaxChars: 120
#低于该强度时不再把情绪原因注入提示词
emotionReasonMinStrength: 40
#情绪原因在无新证据时完全衰减的固定参考天数
emotionReasonDecayDays: 30
#情绪事件流水保留天数
emotionEventRetentionDays: 90
#心情好时非直接消息的回复概率加成
emotionPositiveReplyBonus: 0.05
#心情差或耐心低时非直接消息的回复概率扣减
emotionNegativeReplyPenalty: 0.15
#对高好感用户非直接消息的回复概率加成
emotionAffinityReplyBonus: 0.08
#对低好感或高厌烦用户非直接消息的回复概率扣减
emotionAffinityReplyPenalty: 0.15
#是否允许角色识别并创建自然语言定时提醒
reminderEnable: true
#是否优先调用 AI 识别提醒意图和时间，失败时回退到内置规则
reminderAiParse: true
#定时提醒最长可提前多少天
reminderMaxDays: 30
#非直接提及消息命中兴趣关键词后的回复概率，0 到 1
interestReplyChance: 0.65
#最近与角色聊过后，延续对话的窗口秒数
conversationWindowSecond: 180
continuationReplyChance: 0.80
#其他群员接续当前话题时的回复概率
otherParticipantReplyChance: 0.45
#检测到另一个角色机器人发言时，继续接话的概率
otherRoleBotReplyChance: 0.50
#没有真人插话时，最多连续回应另一个角色机器人多少条
maxConsecutiveOtherRoleMessages: 2
#识别文本中提到的角色名，英文逗号分隔；昵称命中不再代表对方就是该角色
otherRoleBotNames: ""
#其他角色机器人 QQ，多个用英文逗号分隔；只有 QQ 命中才视为角色本人，为空时不识别其他机器人
otherRoleBotQQs: ""
#消息明确艾特其他成员且没有提到角色时是否跳过
addressedOtherMemberSkip: true
#同一用户刚被回复后，多少秒内的短句视为补充不再回复，0 表示关闭
splitMessageSuppressSecond: 20
#触发补充抑制的最大字数
splitMessageSuppressMaxChars: 20
#即时上下文消息条数
shortContextMessages: 80
#短期记忆覆盖天数
shortTermDays: 3
#每累计多少条消息更新一次记忆
memoryUpdateMessages: 50
#每次记忆整理最多读取的消息条数
memoryExtractMessages: 300
#每次记忆整理最多送入模型的字符数，避免上下文过长
memoryExtractMaxChars: 16000
#单次自动整理最多连续处理的批次，避免积压消息一次消耗过多
memoryExtractBatches: 3
#记忆整理输出 Token 上限，reasoning 模型建议不低于 12000
memoryMaxTokens: 12000
#长期记忆合并输出 Token 上限，reasoning 模型建议不低于 32000
memoryMergeMaxTokens: 32000
#记忆合并单批条数
memoryMergeBatchSize: 100
#记忆合并最多执行多少轮分批压缩
memoryMergeMaxRounds: 3
#记忆合并单批失败后的最大重试次数，0 表示不重试
memoryMergeRetryCount: 3
#记忆合并最多同时处理多少批，范围 1 到 4
memoryMergeConcurrency: 4
#单个群两次自动长期记忆合并之间的冷却分钟数，0 表示不限制
memoryMergeCooldownMinute: 60
#两次自动永久记忆合并之间的冷却分钟数，0 表示不限制
globalMemoryMergeCooldownMinute: 60
#是否启用所有群共享的永久记忆
globalMemoryEnable: true
#允许从哪些群的上下文学习永久记忆，多个群号用英文逗号分隔；为空时暂不学习
globalMemoryLearnGroups: ""
#最多加载多少条全局永久记忆
globalMemoryMaxItems: 300
#每次注入角色提示词的全局永久记忆条数
globalMemoryInjectItems: 80
#是否启用角色台词语料检索
speechCorpusEnable: true
#台词语料目录，文件名为 speech-corpus-<角色>.jsonl
speechCorpusDirectory: "speech-corpus"
#每次注入多少条参考台词
speechRetrievalCount: 8
#参考台词注入的最大字符数
speechRetrievalMaxChars: 1200
#台词检索最低分数
speechRetrievalMinScore: 0.35
#回复与台词语料相似度达到多少时视为照抄
speechSimilarityThreshold: 0.78
#少于多少字的回复不做照抄检测
speechSimilarityMinChars: 6
#是否启用可选知识库
knowledgeEnable: true
#知识库目录，相对插件数据目录
knowledgeDirectory: "knowledge"
#单次最多注入几个知识库条目
knowledgeMaxEntries: 4
#每个条目最多注入几个小节
knowledgeMaxSectionsPerEntry: 2
#知识库检索最低分，低于该分数不注入
knowledgeMinScore: 1.0
#单次知识库注入的总字符上限
knowledgeInjectMaxChars: 2000
#允许注入的最高剧透等级：0 只注入无剧透，1 允许轻度，2 全部
knowledgeSpoilerLevel: 0
#是否允许角色通过回复末尾的 <remember> 主动触发记忆整理
activeMemory: true
#是否允许角色理解群聊图片和表情包
imageUnderstandingEnable: true
#图片理解模式：off 关闭 / addressed 只处理直接提及或连续对话 / all 处理全部图片
imageUnderstandingMode: "addressed"
#每个群每小时最多识图次数，0 表示不限制
imageUnderstandingMaxPerHour: 30
#识图结果是否把 OCR 文字注入角色上下文
imageUnderstandingInjectOcr: true
#图片理解使用的模型配置名，留空则使用 MBB-Vision 默认配置
imageUnderstandingProfile: ""
#图片理解结果注入角色的最大字符数
imageUnderstandingMaxChars: 600
#用户发送图片后，后续提问可复用原图作为上下文的时间窗口秒数
imageContextTimeoutSecond: 300
#纯图片与表情消息的识图放到独立异步任务，不阻塞回复线程
imageAsyncEnable: true
#是否等待用户补发表情包后再生成一次回复
stickerAttachEnable: true
#文字回合等待同用户补发表情包的最长秒数，用户又发言或表情包先到都会提前结束等待
stickerAttachWindowSecond: 7
#表情包已开始识别时，最多额外等待多少秒
stickerAttachMaxWaitSecond: 15
#同一用户又发言或表情包已附带时立刻结束等待，不再干等到窗口结束
stickerAttachWaitUntilNextMessage: true
#是否启用群消息合批：短时间内连续到达的消息会合并成一个回合处理，避免刷屏时逐条排队
messageBatchEnable: true
#合批窗口秒数，窗口内到达的新消息会并入同一批
messageBatchWindowSecond: 2
#单个批次最多合并多少条消息，超出时丢弃最旧的非直接点名消息
messageBatchMaxMessages: 10
#合批消息最多等待多少秒，超过且没有点名时直接丢弃，0 表示不丢弃
messageBatchMaxAgeSecond: 20
#合批回合最多回复几段，每段可以回应批内不同的消息
batchMaxSegments: 4
#最多加载多少条长期记忆
maxLongMemories: 150
#长期记忆与永久记忆是否按当前对话相关性排序后注入
memoryRelevanceSort: true
#相关性排序前先加载多少条长期记忆作为候选池
memoryRelevancePoolSize: 600
#长期记忆按相关性注入的字符上限
memoryRelevanceMaxChars: 5000
#永久记忆按相关性注入的字符上限
globalMemoryRelevanceMaxChars: 4000
#单次角色回复最大 Token
replyMaxTokens: 1200
#带图片上下文时单次角色回复最大 Token
replyImageMaxTokens: 4000
#单段回复硬上限字符数，提示词默认按 12 字以内生成
replySegmentMaxChars: 20
#回复拆分时优先使用的断句符号；先找句末标点，再找逗号、顿号、冒号、分号、波浪号等弱标点
replySplitPunctuation: "。！？!?；;，、：,:～~…"
#最多拆分发送多少段
replyMaxSegments: 2
#重复检测时参考最近多少条角色回复
recentReplyCheckCount: 8
#是否启用代码层重复回复兜底检测；关闭后只在提示词中约束
repeatSuppressEnable: false
#与最近角色回复相似度达到多少时跳过，0.3 到 1
repeatSimilarityThreshold: 0.72
#少于多少字的回复不进行重复检测
repeatCheckMinChars: 6
#同一开头在最近角色回复中出现多少次后禁止再次使用
repeatOpeningLimit: 2
#忽略以这些前缀开头的指令消息，英文逗号分隔
commandPrefixes: "/,!,＃,#"
#角色设定文件：persona-aris.json（爱丽丝/Aris）/ persona-momoi.json（桃井）/ persona-midori.json（绿）
personaFile: "persona-aris.json"
#忽略少于多少字的纯文本消息
minMessageLength: 2
