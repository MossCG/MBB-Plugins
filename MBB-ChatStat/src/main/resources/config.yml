#MBB-ChatStat 插件配置

#是否记录群聊消息
enable: true
#单条消息最多保存的文本长度
maxContentLength: 500
#统计图片中最近消息显示条数
recentMessageCount: 10
#统计图片中排行榜显示条数
topCount: 10
#默认统计天数
defaultDays: 1
#AI 总结使用的模型配置名，对应 MBB-AI 的 profiles.json
aiProfile: "default"
#AI 总结最多读取的最近消息条数
aiSummaryMessageCount: 50
#AI 总结最大输出 Token
aiSummaryMaxTokens: 1200
